<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROYAL PALACE · 777 Roulette</title>
<meta name="theme-color" content="#0a0707">
<link rel="stylesheet" href="/theme.css">
<style>
.back{display:inline-block;margin-bottom:6px;color:var(--gold);text-decoration:none;font-size:13px;letter-spacing:.12em}
.back:hover,.back:focus-visible{color:var(--gold-hi);outline:none;text-decoration:underline}
.ttl{text-align:center;font-family:var(--serif);font-weight:700;letter-spacing:.16em;line-height:1.1;
  font-size:clamp(28px,8vw,48px);filter:drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 18px rgba(212,175,55,.3))}
.ttl span{display:block;font-size:.5em;letter-spacing:.42em;padding-left:.42em;margin-top:.2em}

/* ---------- 슬롯머신 ---------- */
.machine-wrap{--cell:clamp(78px,23vw,112px);position:relative;margin:clamp(12px,3vw,22px) 0 6px;padding-right:44px}
.machine{position:relative;filter:drop-shadow(0 18px 34px rgba(0,0,0,.75))}
.marquee{position:relative;margin:0 14px;padding:12px 14px 14px;border:3px solid var(--gold);border-bottom:0;border-radius:16px 16px 0 0;
  background:linear-gradient(180deg,#1a0a0c,#3b0710);box-shadow:inset 0 0 22px rgba(0,0,0,.8)}
.plate{position:relative;text-align:center;padding:6px 0 8px;border:2px solid #f6e3a1;border-radius:10px;
  background:radial-gradient(ellipse at 50% 0,#9b1b30,#4a0914 70%);box-shadow:inset 0 0 14px rgba(0,0,0,.7)}
.plate b{font-family:var(--serif);font-size:clamp(24px,7.4vw,38px);letter-spacing:.22em;padding-left:.22em;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.8))}
.pile{height:clamp(18px,5vw,26px);margin-top:8px;border-radius:6px;box-shadow:inset 0 6px 10px rgba(0,0,0,.6)}
.coins{background:
  radial-gradient(ellipse at 50% 35%,#fff3c4 0 16%,#e2bd4a 17% 58%,#8a6a1c 59% 70%,transparent 72%) 0 0/20px 14px,
  radial-gradient(ellipse at 50% 35%,#fff3c4 0 16%,#cfa532 17% 58%,#7a5c14 59% 70%,transparent 72%) 10px 7px/20px 14px,#2a1604}
.bulbs{position:absolute;left:12px;right:12px;height:10px;background:radial-gradient(circle,#f6e3a1 0 2.6px,transparent 3.4px) 0 50%/16px 10px repeat-x;animation:blink 1.4s steps(1) infinite}
.bulbs.t{top:2px}.bulbs.b{bottom:2px;animation-delay:.7s}
@keyframes blink{0%{opacity:1}50%{opacity:.3}}
.machine.hit .bulbs{animation-duration:.25s}
.machine.hit .plate{animation:flash .4s steps(1) infinite}
@keyframes flash{50%{background:radial-gradient(ellipse at 50% 0,#f6e3a1,#b8922a 75%)}}

.cab{position:relative;padding:14px clamp(10px,3vw,18px) 16px;border:3px solid var(--gold);border-radius:6px 6px 14px 14px;
  background:linear-gradient(180deg,#8f1429 0%,#5a0b19 55%,#35060f 100%);box-shadow:inset 0 0 30px rgba(0,0,0,.55),0 0 0 1px #000}
.frame{display:grid;grid-template-columns:auto 1fr 1fr 1fr auto;gap:clamp(4px,1.4vw,8px);align-items:center;padding:clamp(6px,2vw,10px);
  border-radius:8px;background:linear-gradient(135deg,#f6e3a1,#b8922a 45%,#8a6a1c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.5),0 0 22px rgba(212,175,55,.25)}
.arrow{font-size:clamp(14px,4vw,20px);color:#9b1b30;text-shadow:0 1px 0 #fff3c4;line-height:1}
.reel{position:relative;height:var(--cell);overflow:hidden;border-radius:4px;background:linear-gradient(180deg,#e9dcc0,#fffaf0 50%,#e9dcc0);
  box-shadow:inset 0 0 0 2px #000,inset 0 0 12px rgba(0,0,0,.6)}
.reel::after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(0,0,0,.5),transparent 24%,transparent 76%,rgba(0,0,0,.5)),
  linear-gradient(115deg,rgba(255,255,255,.28),transparent 30%)}
.strip{transform:translateY(calc(var(--cell) * var(--i, 0) * -1));will-change:transform}
.reel.spin .strip{filter:blur(1.6px)}
.cell{height:var(--cell);display:grid;place-items:center;font-family:var(--serif);font-weight:900;line-height:1;font-size:calc(var(--cell) * .74);color:#14090a}
.cell.s7{color:#c0182f;-webkit-text-stroke:2px #5a0b19;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.cell.red{color:#b3122a}
.cell.sbar span{font-size:calc(var(--cell) * .21);letter-spacing:.06em;padding:2px 5px 2px 7px;border:2px solid #14090a;border-radius:4px;background:#fff7dc;color:#14090a}
.reel.hl{animation:glow .5s ease-in-out 8 alternate}
@keyframes glow{to{box-shadow:inset 0 0 0 2px #000,inset 0 0 18px rgba(0,0,0,.5),0 0 24px 4px rgba(246,227,161,.9)}}

.leds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.led{padding:6px 10px;border-radius:6px;background:#1a0306;box-shadow:inset 0 0 8px #000,0 0 0 2px rgba(212,175,55,.55);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.led span{font-size:10px;letter-spacing:.2em;color:#b08a91}
.led b{font-family:'Courier New',monospace;font-size:clamp(18px,5vw,24px);color:#ff5568;text-shadow:0 0 8px rgba(255,85,104,.7)}
.tray{margin-top:12px;padding:8px 10px 10px;border-radius:6px;background:#0a0405;box-shadow:inset 0 0 0 2px #000,0 0 0 2px rgba(212,175,55,.5)}
.tray .pile{margin:0;height:clamp(34px,9vw,52px)}

.lever{position:absolute;right:0;top:30%;width:44px;height:150px;background:none;border:0;cursor:pointer;padding:0}
.lever:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.lever:disabled{cursor:not-allowed}
.lever .arm{position:absolute;left:50%;bottom:0;width:10px;height:112px;margin-left:-5px;border-radius:5px;transform-origin:bottom;transition:transform .3s;
  background:linear-gradient(90deg,#777,#f4f4f4 45%,#8a8a8a);box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.lever .ball{position:absolute;left:50%;top:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;transition:transform .3s;
  background:radial-gradient(circle at 32% 28%,#ffb0b8,#d4142e 45%,#6b0716);box-shadow:0 4px 8px rgba(0,0,0,.6)}
.lever.pull .arm{transform:scaleY(.36)}
.lever.pull .ball{transform:translateY(74px)}
.lever::before{content:"";position:absolute;left:50%;bottom:-6px;width:30px;height:16px;margin-left:-15px;border-radius:6px;background:linear-gradient(180deg,#d4af37,#6b4f10);box-shadow:0 2px 0 #000}

/* ---------- 결과/조작 ---------- */
.result{min-height:78px;margin:8px 0 14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--serif);letter-spacing:.08em}
.result .lbl{font-size:clamp(14px,3.6vw,17px);letter-spacing:.3em;color:#b9a98b}
.result .amt{font-size:clamp(26px,7vw,38px);font-weight:700}
.result.idle .lbl{font-family:var(--sans);letter-spacing:.04em;font-size:14px}
.result.win .amt{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(246,227,161,.45))}
.result.win .lbl{color:var(--gold-hi)}
.result.lose .amt{color:#ff8a9a}
.result.err .lbl{color:#ffd7dd;font-family:var(--sans);letter-spacing:.02em;font-size:14px}
.row-l{font-family:var(--serif);letter-spacing:.3em;font-size:12px;color:var(--gold);margin-bottom:10px;text-align:center}
.bets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.bet{height:46px;padding:0 2px;font-family:var(--serif);font-weight:700;font-size:clamp(11px,3vw,14px);letter-spacing:.02em;cursor:pointer;
  color:var(--gold-hi);background:rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.45);border-radius:2px;transition:background .2s,border-color .2s}
.bet:hover:not(:disabled){border-color:var(--gold-hi)}
.bet:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.bet.on{background:linear-gradient(180deg,var(--burg-hi),var(--burg));border-color:var(--gold-hi);color:#fff;box-shadow:0 0 16px rgba(155,27,48,.55)}
.bet:disabled{opacity:.35;cursor:not-allowed}
#spin{margin-top:0}
.broke{margin-top:16px;text-align:center;font-size:14px;color:#ffd7dd}
.broke .btn{margin-top:10px;height:46px}
.pay{margin-top:18px;padding:0}
.pay summary{cursor:pointer;list-style:none;padding:16px 20px;text-align:center;font-family:var(--serif);letter-spacing:.24em;font-size:13px;color:var(--gold-hi)}
.pay summary::-webkit-details-marker{display:none}
.pay summary::after{content:" ▾"}.pay[open] summary::after{content:" ▴"}
.pay .in{padding:0 20px 18px;font-size:14px;line-height:1.7;color:#e0d2b2}
.pay dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.pay dt{color:#9d8e72;font-size:12px;letter-spacing:.12em}
.pay dd{text-align:right;font-family:var(--serif);font-weight:700;color:var(--gold-hi)}
.pay .note{margin-top:12px;text-align:center;font-size:12.5px;color:#9d8e72;line-height:1.6}
.recent{margin-top:18px;text-align:center}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:30px}
.dot{min-width:46px;padding:4px 8px;font-family:var(--serif);font-weight:700;font-size:12px;border:1px solid rgba(212,175,55,.3);color:#7d705b;background:rgba(0,0,0,.45)}
.dot.jp{background:var(--burg);color:#fff;border-color:var(--gold-hi)}
.dot.pr{color:var(--gold-hi);border-color:var(--gold);background:rgba(212,175,55,.14)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:#7d705b;line-height:1.6}

.jackpot{position:fixed;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:20px;
  background:radial-gradient(circle at 50% 45%,rgba(118,16,34,.95),rgba(0,0,0,.97) 75%);animation:fadein .4s}
.jackpot .big{font-family:var(--serif);font-weight:700;font-size:clamp(84px,26vw,190px);line-height:1;letter-spacing:.06em;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(246,227,161,.7));animation:pulse 1.2s ease-in-out infinite alternate}
.jackpot .sub{font-family:var(--serif);letter-spacing:.5em;padding-left:.5em;font-size:clamp(16px,4.6vw,28px);color:var(--gold-hi);margin-top:6px}
.jackpot .amt{font-family:var(--serif);font-weight:700;font-size:clamp(24px,7vw,44px);color:#fff;margin:18px 0 6px}
.jackpot .mult{font-size:14px;color:#d8c79f;margin-bottom:24px}
.jackpot .btn{width:min(260px,80vw);margin:0 auto}
.conf{position:fixed;top:-40px;z-index:41;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@keyframes fadein{from{opacity:0}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.bulbs,.jackpot .big,.machine.hit .plate,.reel.hl{animation:none!important}}
</style>
</head>
<body>
<main class="page narrow">
  <a class="back" href="/lobby#luck">‹ LUCK GAMES</a>
  <h1 class="ttl gold-text">777<span>ROULETTE</span></h1>

  <div class="machine-wrap">
    <div class="machine" id="machine">
      <div class="marquee">
        <i class="bulbs t" aria-hidden="true"></i>
        <div class="plate"><b>JACKPOT</b></div>
        <div class="pile coins" aria-hidden="true"></div>
        <i class="bulbs b" aria-hidden="true"></i>
      </div>
      <div class="cab">
        <div class="frame" role="img" aria-label="슬롯머신 릴 3개">
          <i class="arrow" aria-hidden="true">▶</i>
          <div class="reel" id="reel0"><div class="strip"></div></div>
          <div class="reel" id="reel1"><div class="strip"></div></div>
          <div class="reel" id="reel2"><div class="strip"></div></div>
          <i class="arrow" aria-hidden="true">◀</i>
        </div>
        <div class="leds">
          <div class="led"><span>BET</span><b id="led-bet">10</b></div>
          <div class="led"><span>WIN</span><b id="led-win">0</b></div>
        </div>
        <div class="tray" aria-hidden="true"><div class="pile coins"></div></div>
      </div>
    </div>
    <button class="lever" id="lever" type="button" aria-label="레버를 당겨 스핀" disabled><span class="arm"></span><span class="ball"></span></button>
  </div>

  <div class="result idle" id="result" role="status" aria-live="polite"><span class="lbl">베팅 금액을 고르고 SPIN을 누르거나 레버를 당기세요</span></div>

  <section class="panel">
    <div class="row-l">BET</div>
    <div class="bets" id="bets"></div>
    <button class="btn gold" id="spin" type="button" disabled>SPIN</button>
    <div class="broke" id="broke" hidden>
      코인이 부족합니다. BANK에서 빌릴 수 있어요.
      <button class="btn ghost" id="open-bank" type="button">BANK 열기</button>
    </div>
  </section>

  <details class="panel pay">
    <summary>RULES · 규칙과 확률</summary>
    <div class="in">
      <dl>
        <dt>777 (릴 3개 모두 7)</dt><dd id="p-jp">–</dd>
        <dt>같은 모양 2개</dt><dd id="p-pair">–</dd>
        <dt>그 외</dt><dd>꽝 (세 모양이 모두 다름)</dd>
        <dt>기대 환수율</dt><dd id="p-rtp">–</dd>
      </dl>
      <p class="note">결과는 서버에서 무작위로 정해집니다. 같은 모양이 3개 나오는 경우는 777뿐입니다.</p>
    </div>
  </details>

  <section class="recent">
    <div class="row-l">RECENT</div>
    <div class="dots" id="dots"></div>
  </section>

  <p class="foot">가상 코인으로만 즐기는 게임입니다. 실제 금전과는 관계가 없습니다.</p>
</main>

<div class="jackpot" id="jackpot" hidden role="dialog" aria-modal="true" aria-label="777 잭팟">
  <div>
    <div class="big">777</div>
    <div class="sub">JACKPOT</div>
    <div class="amt" id="jp-amt"></div>
    <div class="mult" id="jp-mult"></div>
    <button class="btn gold" id="jp-close" type="button">COLLECT</button>
  </div>
</div>

<script src="/app.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };

  // 심볼 순서는 서버와 같아야 합니다. (0 = 7)
  var SYM = [
    { t: '7', cls: 's7' }, { t: 'BAR', cls: 'sbar' }, { t: '♦', cls: 'red' },
    { t: '♠', cls: '' }, { t: '♥', cls: 'red' }, { t: '♣', cls: '' }
  ];
  var N = SYM.length, REPS = 14;
  var reels = [$('#reel0'), $('#reel1'), $('#reel2')];
  var strips = reels.map(function (r) { return r.firstElementChild; });
  var idx = [N + 1, N + 0, N + 4]; // 시작 모양: BAR, 7, ♥ (현재 보이는 칸 번호)
  var cfg = null, chips = 0, betMode = 10, busy = false, recent = [];

  // ---------- 릴 만들기 ----------
  strips.forEach(function (strip, k) {
    var html = '';
    for (var i = 0; i < N * REPS; i++) {
      var s = SYM[i % N];
      html += '<div class="cell ' + s.cls + '">' + (s.t === 'BAR' ? '<span>BAR</span>' : s.t) + '</div>';
    }
    strip.innerHTML = html;
    strip.style.setProperty('--i', idx[k]);
  });

  // ---------- 베팅 UI ----------
  var betsBox = $('#bets'), spinBtn = $('#spin'), lever = $('#lever');
  var BETS = [10, 50, 100, 500, 'all'];

  function currentBet() { return betMode === 'all' ? Math.min(chips, cfg.maxBet) : betMode; }
  function normalizeBet() {
    if (betMode !== 'all' && betMode > chips) {
      var ok = [500, 100, 50, 10].filter(function (v) { return v <= chips; });
      betMode = ok.length ? ok[0] : 'all';
    }
  }
  function renderControls() {
    betsBox.innerHTML = '';
    BETS.forEach(function (v) {
      var b = document.createElement('button'), cost = v === 'all' ? Math.min(chips, cfg.maxBet) : v;
      b.type = 'button';
      b.className = 'bet' + (betMode === v ? ' on' : '');
      b.textContent = v === 'all' ? 'ALL IN' : RP.fmt(v);
      b.disabled = busy || cost < cfg.minBet || cost > chips;
      b.setAttribute('aria-pressed', betMode === v ? 'true' : 'false');
      b.addEventListener('click', function () { betMode = v; renderControls(); });
      betsBox.appendChild(b);
    });
    var bet = currentBet(), can = !busy && bet >= cfg.minBet && bet <= chips;
    spinBtn.disabled = !can; lever.disabled = !can;
    spinBtn.textContent = busy ? 'SPINNING…' : 'SPIN · ' + RP.fmt(bet);
    $('#led-bet').textContent = RP.fmt(Math.max(bet, 0));
    $('#broke').hidden = busy || chips >= cfg.minBet;
  }

  // ---------- 결과 표시 ----------
  function setResult(cls, label, amt) {
    var r = $('#result');
    r.className = 'result ' + cls;
    r.innerHTML = '<span class="lbl"></span>' + (amt ? '<span class="amt"></span>' : '');
    r.querySelector('.lbl').textContent = label;
    if (amt) r.querySelector('.amt').textContent = amt;
  }
  function renderRecent() {
    var box = $('#dots');
    box.innerHTML = '';
    if (!recent.length) { box.innerHTML = '<span class="dot">–</span>'; return; }
    recent.slice(0, 10).forEach(function (h) {
      var s = document.createElement('span');
      s.className = 'dot' + (h.kind === 'jackpot' ? ' jp' : h.kind === 'pair' ? ' pr' : '');
      s.textContent = h.kind === 'jackpot' ? '777' : h.kind === 'pair' ? 'PAIR' : 'MISS';
      box.appendChild(s);
    });
  }
  function coinRain() {
    if (RP.reduceMotion) return;
    var ch = ['●', '★', '♦', '♠', '♥', '♣'];
    for (var i = 0; i < 46; i++) {
      var c = document.createElement('span');
      c.className = 'conf';
      c.textContent = ch[i % ch.length];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.fontSize = (16 + Math.random() * 24) + 'px';
      c.style.color = i % 3 === 0 ? '#9b1b30' : '#f6e3a1';
      c.style.animationDuration = (2.6 + Math.random() * 2.4) + 's';
      c.style.animationDelay = (Math.random() * 1.2) + 's';
      document.body.appendChild(c);
      setTimeout(function (n) { n.remove(); }, 7000, c);
    }
  }
  function pairIdx(r) {
    for (var i = 0; i < 3; i++) for (var j = i + 1; j < 3; j++) if (r[i] === r[j]) return [i, j];
    return [];
  }
  function highlight(list) { list.forEach(function (k) { reels[k].classList.add('hl'); }); }
  function reveal(d) {
    chips = RP.coins(d.chips);
    RP.setChips(chips);
    $('#led-win').textContent = RP.fmt(d.payout);
    if (d.kind === 'jackpot') {
      setResult('win', '777 JACKPOT!  ×' + d.mult, '+' + RP.fmt(d.delta) + ' COINS');
      highlight([0, 1, 2]); $('#machine').classList.add('hit');
    } else if (d.kind === 'pair') {
      setResult('win', 'PAIR!  ×' + d.mult, '+' + RP.fmt(d.delta) + ' COINS');
      highlight(pairIdx(d.reels));
    } else {
      setResult('lose', 'MISS', '−' + RP.fmt(d.bet) + ' COINS');
    }
    recent.unshift({ kind: d.kind });
    renderRecent();
    busy = false;
    normalizeBet();
    renderControls();
    if (d.jackpot) {
      $('#jp-amt').textContent = '+' + RP.fmt(d.delta) + ' COINS';
      $('#jp-mult').textContent = '베팅 ' + RP.fmt(d.bet) + ' × ' + d.mult + ' = ' + RP.fmt(d.payout) + ' 지급';
      $('#jackpot').hidden = false;
      coinRain();
      $('#jp-close').focus();
    }
  }

  // ---------- 스핀 ----------
  function spinReels(target, done) {
    var rounds = [4, 6, 8], durs = RP.reduceMotion ? [.01, .01, .01] : [2.0, 2.8, 3.6], left = 3;
    target.forEach(function (s, k) {
      var strip = strips[k], i0 = idx[k], cur = i0 % N;
      var i1 = i0 + rounds[k] * N + (((s - cur) % N) + N) % N; // 최대 약 64칸 < 84칸
      reels[k].classList.add('spin');
      void strip.offsetWidth;
      strip.style.transition = 'transform ' + durs[k] + 's cubic-bezier(.2,.75,.25,1)';
      strip.style.setProperty('--i', i1);
      setTimeout(function () {
        reels[k].classList.remove('spin');
        strip.style.transition = 'none';          // 모양이 6칸마다 반복되므로 티 나지 않게 처음 영역으로 되돌림
        idx[k] = N + s;
        strip.style.setProperty('--i', idx[k]);
        if (--left === 0) done();
      }, durs[k] * 1000 + 80);
    });
  }

  function pull() {
    lever.classList.add('pull');
    setTimeout(function () { lever.classList.remove('pull'); }, 420);
  }
  function startSpin() {
    if (busy) return;
    var bet = currentBet();
    if (bet < cfg.minBet || bet > chips) return;
    busy = true; renderControls(); pull();
    $('#machine').classList.remove('hit');
    reels.forEach(function (r) { r.classList.remove('hl'); });
    $('#led-win').textContent = '0';
    setResult('idle', '릴이 돌아갑니다…');
    RP.api('/api/roulette/spin', { bet: bet }).then(function (r) {
      if (!r.ok) {
        busy = false; renderControls();
        setResult('err', r.d.error || '요청을 처리하지 못했습니다.');
        return;
      }
      spinReels(r.d.reels, function () { reveal(r.d); });
    }).catch(function () {
      busy = false; renderControls();
      setResult('err', '서버에 연결할 수 없습니다. 네트워크를 확인해 주세요.');
    });
  }
  spinBtn.addEventListener('click', startSpin);
  lever.addEventListener('click', startSpin);

  $('#open-bank').addEventListener('click', function () { RP.openBank(); });
  $('#jp-close').addEventListener('click', function () { $('#jackpot').hidden = true; spinBtn.focus(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#jackpot').hidden) $('#jp-close').click(); });

  // 은행에서 빌리거나 갚았을 때 베팅 UI 갱신
  RP.onChips = function (n) {
    if (!cfg || busy) return;
    chips = n; normalizeBet(); renderControls();
  };

  // ---------- 시작 ----------
  renderRecent();
  Promise.all([
    new Promise(function (res) { RP.ready(res); }),
    RP.api('/api/roulette/config')
  ]).then(function (v) {
    var p = v[0], c = v[1];
    if (!c.ok) { setResult('err', '게임 설정을 불러오지 못했습니다.'); return; }
    cfg = c.d; chips = RP.coins(p.chips);
    recent = (p.history || []).filter(function (h) { return h.game === 'roulette'; }).map(function (h) {
      return { kind: h.mult >= cfg.payoutMult ? 'jackpot' : h.mult > 0 ? 'pair' : 'miss' };
    });
    $('#p-jp').textContent = '1 / ' + RP.fmt(cfg.winOdds) + ' (' + (100 / cfg.winOdds).toFixed(2) + '%) · ×' + cfg.payoutMult;
    $('#p-pair').textContent = '약 ' + Math.round(cfg.pairChance * 100) + '% · ×' + cfg.pairMult;
    $('#p-rtp').textContent = ((cfg.payoutMult / cfg.winOdds + cfg.pairChance * cfg.pairMult) * 100).toFixed(1) + '%';
    normalizeBet();
    renderRecent();
    renderControls();
  });
})();
</script>
</body>
</html>
