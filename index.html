<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROYAL PALACE · Login</title>
<meta name="theme-color" content="#0a0707">
<style>
:root{
  --gold:#d4af37; --gold-hi:#f6e3a1; --gold-lo:#8a6a1c;
  --burg:#6b0f1f; --burg-hi:#9b1b30;
  --ink:#080606; --ink-2:#120c0c; --err:#ff9aa8;
  --gold-grad:linear-gradient(135deg,#8a6a1c 0%,#d4af37 22%,#f6e3a1 48%,#d4af37 70%,#8a6a1c 100%);
  --serif:'Cinzel','Trajan Pro','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Helvetica Neue',Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:#e9dcc0;font-family:var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ---------- 배경 ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(ellipse 70% 60% at 50% 38%,#1b1210 0%,#0b0808 60%,#050303 100%)}
.stage>*{position:absolute;pointer-events:none}
/* 대리석 결 */
.marble{inset:0;opacity:.2;mix-blend-mode:screen;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.005 .011' numOctaves='6' seed='11' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .84 0 0 0 0 .69 0 0 0 0 .36 1 0 0 0 0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0 0 0 0 0 0 0 0 .35 1 .35 0 0 0 0 0 0 0 0'/></feComponentTransfer><feGaussianBlur stdDeviation='1.1'/></filter><rect width='100%' height='100%' filter='url(%23m)'/></svg>");background-size:700px 700px}
.marble::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,transparent 0 119px,rgba(212,175,55,.07) 119px 120px),
  repeating-linear-gradient(0deg,transparent 0 119px,rgba(212,175,55,.05) 119px 120px)}
/* 웅장한 아치 입구 */
.arch{left:50%;top:-6vh;bottom:0;width:min(980px,98vw);transform:translateX(-50%);
  border-radius:50% 50% 0 0/26% 26% 0 0;
  border:2px solid transparent;
  background:linear-gradient(180deg,#1f1311 0%,#0e0808 55%,#070404 100%) padding-box,var(--gold-grad) border-box;
  box-shadow:0 0 90px rgba(212,175,55,.12) inset,0 0 60px rgba(212,175,55,.08)}
.arch::before{content:"";position:absolute;inset:16px;border-radius:inherit;border:1px solid rgba(212,175,55,.35)}
.arch::after{content:"";position:absolute;inset:34px;border-radius:inherit;border:1px solid rgba(155,27,48,.5)}
/* 기둥 */
.col{top:0;bottom:0;width:clamp(36px,6vw,90px);
  background:linear-gradient(90deg,#050303,#1d1311 35%,#2b1d18 50%,#1d1311 65%,#050303);
  border-left:1px solid rgba(212,175,55,.5);border-right:1px solid rgba(212,175,55,.5);
  box-shadow:0 0 40px rgba(0,0,0,.8)}
.col::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(212,175,55,.08) 9px 10px)}
.col.l{left:max(0px,calc(50% - 640px))}.col.r{right:max(0px,calc(50% - 640px))}
/* 샹들리에 조명 */
.lights{inset:0;background:
  radial-gradient(ellipse 28% 34% at 50% -4%,rgba(246,227,161,.30),transparent 70%),
  radial-gradient(ellipse 18% 26% at 18% 0,rgba(212,175,55,.16),transparent 70%),
  radial-gradient(ellipse 18% 26% at 82% 0,rgba(212,175,55,.16),transparent 70%),
  radial-gradient(ellipse 60% 24% at 50% 108%,rgba(155,27,48,.40),transparent 70%);
  animation:glow 7s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.82}to{opacity:1}}
/* 버건디 카펫 */
.floor{left:0;right:0;bottom:0;height:20vh;background:linear-gradient(0deg,rgba(107,15,31,.75),rgba(107,15,31,.15) 70%,transparent);
  border-top:1px solid rgba(212,175,55,.25)}
.vig{inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.78) 100%)}
/* 카드 문양 */
.suit{font-family:Georgia,serif;line-height:1;user-select:none;animation:float 9s ease-in-out infinite alternate}
.suit.g{color:rgba(212,175,55,.2)}.suit.b{color:rgba(155,27,48,.38)}
@keyframes float{from{transform:translateY(0) rotate(var(--r,0deg))}to{transform:translateY(-14px) rotate(calc(var(--r,0deg) + 4deg))}}

/* ---------- 레이아웃 ---------- */
.wrap{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(18px,4vh,44px) 16px calc(clamp(18px,4vh,44px) + env(safe-area-inset-bottom))}

/* ---------- 로고 ---------- */
.brand{text-align:center;margin-bottom:clamp(14px,3vh,30px)}
.crown{width:clamp(64px,9vw,96px);height:auto;filter:drop-shadow(0 0 14px rgba(212,175,55,.5))}
.logo{font-family:var(--serif);font-weight:700;line-height:1;letter-spacing:.14em;
  font-size:clamp(34px,7.2vw,76px);margin-top:6px;padding-left:.14em;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(0,0,0,.7)) drop-shadow(0 0 22px rgba(212,175,55,.28))}
.logo span{display:block;font-size:.62em;letter-spacing:.42em;padding-left:.42em;margin-top:.12em}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:12px;color:var(--gold)}
.orn i{height:1px;width:clamp(40px,10vw,110px);background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{font-size:12px;letter-spacing:.5em;padding-left:.5em;font-family:var(--serif);font-weight:400;color:var(--gold-hi);opacity:.9}

/* ---------- 패널 ---------- */
.panel{position:relative;width:min(440px,100%);padding:clamp(26px,4vw,38px) clamp(20px,4vw,38px) clamp(24px,4vw,32px);
  background:linear-gradient(180deg,rgba(24,15,14,.88),rgba(8,5,5,.9));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(212,175,55,.65);
  box-shadow:0 0 0 4px rgba(0,0,0,.55),0 0 0 5px rgba(212,175,55,.22),0 24px 70px rgba(0,0,0,.75),0 0 60px rgba(212,175,55,.12)}
.panel::before{content:"";position:absolute;inset:7px;border:1px solid rgba(212,175,55,.28);pointer-events:none}
.corner{position:absolute;width:34px;height:34px;color:var(--gold)}
.corner.tl{top:-1px;left:-1px}.corner.tr{top:-1px;right:-1px;transform:scaleX(-1)}
.corner.bl{bottom:-1px;left:-1px;transform:scaleY(-1)}.corner.br{bottom:-1px;right:-1px;transform:scale(-1)}
.title{font-family:var(--serif);text-align:center;color:var(--gold-hi);letter-spacing:.32em;padding-left:.32em;font-size:15px;margin-bottom:22px}
.title small{display:block;margin-top:6px;font-family:var(--sans);letter-spacing:.08em;padding-left:0;font-size:12px;color:#a8977a}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;letter-spacing:.24em;color:var(--gold);margin-bottom:7px;text-transform:uppercase}
.inp{position:relative}
.inp input{width:100%;height:50px;padding:0 46px 0 16px;font:inherit;font-size:16px;color:#f4ead0;
  background:rgba(0,0,0,.55);border:1px solid rgba(212,175,55,.38);border-radius:2px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s}
.inp input::placeholder{color:#6f6150}
.inp input:focus{border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(212,175,55,.18),0 0 18px rgba(212,175,55,.2);background:rgba(0,0,0,.72)}
.field.bad input{border-color:#d1445a;box-shadow:0 0 0 3px rgba(155,27,48,.3)}
.eye{position:absolute;right:4px;top:4px;width:42px;height:42px;background:none;border:0;color:var(--gold);cursor:pointer;opacity:.75}
.eye:hover,.eye:focus-visible{opacity:1;outline:none}
.eye svg{width:20px;height:20px}
.ferr{display:block;min-height:0;font-size:12.5px;color:var(--err);margin-top:6px}
.ferr:empty{display:none}
.alert{margin:2px 0 16px;padding:10px 14px;font-size:13.5px;line-height:1.5;color:#ffd7dd;
  background:linear-gradient(90deg,rgba(107,15,31,.75),rgba(107,15,31,.25));border-left:3px solid #d1445a}
.alert[hidden]{display:none}
.alert.ok{background:linear-gradient(90deg,rgba(138,106,28,.5),rgba(138,106,28,.12));border-left-color:var(--gold);color:var(--gold-hi)}
.confirm[hidden]{display:none}

.btn{display:block;width:100%;height:52px;font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.34em;padding-left:.34em;
  border-radius:2px;cursor:pointer;transition:transform .15s,box-shadow .25s,background .25s,color .25s,filter .25s}
.btn:active{transform:translateY(1px)}
.btn:disabled{cursor:wait;filter:grayscale(.5) brightness(.8)}
.btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.btn.gold{position:relative;overflow:hidden;margin-top:6px;color:#1a1204;border:1px solid #f6e3a1;
  background:var(--gold-grad);box-shadow:0 6px 22px rgba(212,175,55,.3),inset 0 1px 0 rgba(255,255,255,.55)}
.btn.gold::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transition:left .6s}
.btn.gold:hover:not(:disabled){box-shadow:0 8px 30px rgba(246,227,161,.45),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.gold:hover::after{left:120%}
.btn.ghost{color:var(--gold-hi);background:transparent;border:1px solid rgba(212,175,55,.7)}
.btn.ghost:hover{background:linear-gradient(180deg,var(--burg-hi),var(--burg));border-color:var(--gold-hi);color:#fff;box-shadow:0 0 22px rgba(155,27,48,.55)}
.sep{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--gold);font-size:11px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(212,175,55,.55))}
.sep::after{transform:scaleX(-1)}
.suits{display:flex;justify-content:center;gap:18px;margin-top:20px;font-size:17px;color:rgba(212,175,55,.55)}
.suits .r{color:rgba(155,27,48,.95)}
.welcome{text-align:center;padding:6px 0 4px}
.welcome p{color:#cdbd9b;font-size:14px;line-height:1.7;margin:10px 0 24px}
.welcome h2{font-family:var(--serif);font-size:clamp(20px,5vw,26px);letter-spacing:.12em;word-break:break-all;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
[hidden]{display:none!important}

/* ---------- 반응형 ---------- */
@media (max-width:900px){.col{display:none}.arch{width:112vw}}
@media (max-width:480px){
  .suit{display:none}.suit.keep{display:block}
  .inp input{height:48px}.arch::after{inset:22px}
}
@media (max-height:700px) and (min-width:481px){.crown{width:56px}.orn{margin-top:8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- 재사용 장식 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flourish" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
    <path d="M2 32V10C2 5 5 2 10 2h22"/><path d="M8 32V14c0-3 3-6 6-6h18" opacity=".5"/>
    <circle cx="10" cy="10" r="2.2" fill="currentColor" stroke="none"/>
    <path d="M16 2c0 4-3 6-6 6M2 16c4 0 6-3 6-6" opacity=".8"/>
  </symbol>
</svg>

<div class="stage" aria-hidden="true">
  <div class="col l"></div><div class="col r"></div>
  <div class="arch"></div>
  <div class="marble"></div>
  <div class="lights"></div>
  <div class="floor"></div>
  <span class="suit g keep" style="left:7%;top:14%;font-size:64px;--r:-12deg">♠</span>
  <span class="suit b keep" style="right:8%;top:20%;font-size:78px;--r:10deg;animation-delay:-3s">♥</span>
  <span class="suit b" style="left:13%;bottom:22%;font-size:56px;--r:8deg;animation-delay:-5s">♦</span>
  <span class="suit g" style="right:12%;bottom:18%;font-size:70px;--r:-9deg;animation-delay:-2s">♣</span>
  <span class="suit g" style="left:30%;top:6%;font-size:34px;--r:14deg;animation-delay:-6s">♦</span>
  <span class="suit g" style="right:28%;top:8%;font-size:30px;--r:-10deg;animation-delay:-1s">♠</span>
  <div class="vig"></div>
</div>

<main class="wrap">
  <header class="brand">
    <svg class="crown" viewBox="0 0 120 80" aria-hidden="true">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8a6a1c"/><stop offset=".45" stop-color="#f6e3a1"/><stop offset="1" stop-color="#b8922a"/></linearGradient></defs>
      <path d="M10 64 L6 22 L34 42 L60 8 L86 42 L114 22 L110 64 Z" fill="url(#cg)" stroke="#f6e3a1" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="10" y="64" width="100" height="9" rx="2" fill="url(#cg)" stroke="#f6e3a1" stroke-width="1.5"/>
      <circle cx="60" cy="8" r="5" fill="#9b1b30" stroke="#f6e3a1" stroke-width="1.5"/>
      <circle cx="6" cy="22" r="4" fill="#9b1b30" stroke="#f6e3a1" stroke-width="1.2"/>
      <circle cx="114" cy="22" r="4" fill="#9b1b30" stroke="#f6e3a1" stroke-width="1.2"/>
      <circle cx="60" cy="50" r="4.5" fill="#6b0f1f" stroke="#f6e3a1" stroke-width="1.2"/>
    </svg>
    <h1 class="logo">ROYAL<span>PALACE</span></h1>
    <div class="orn"><i></i><b>◆ VIP LOUNGE ◆</b><i></i></div>
  </header>

  <section class="panel" aria-labelledby="ptitle">
    <svg class="corner tl" aria-hidden="true"><use href="#flourish"/></svg>
    <svg class="corner tr" aria-hidden="true"><use href="#flourish"/></svg>
    <svg class="corner bl" aria-hidden="true"><use href="#flourish"/></svg>
    <svg class="corner br" aria-hidden="true"><use href="#flourish"/></svg>

    <!-- 로그인 / 회원가입 폼 -->
    <form id="form" novalidate autocomplete="on">
      <h2 class="title" id="ptitle"><span id="ttl">MEMBER LOGIN</span><small id="sub">회원 전용 라운지에 오신 것을 환영합니다</small></h2>

      <div id="alert" class="alert" role="alert" aria-live="assertive" hidden></div>

      <div class="field" id="f-id">
        <label for="uid">ID</label>
        <div class="inp"><input id="uid" name="username" type="text" placeholder="아이디" autocomplete="username" autocapitalize="none" spellcheck="false" aria-describedby="e-id"></div>
        <span class="ferr" id="e-id"></span>
      </div>

      <div class="field" id="f-pw">
        <label for="pw">Password</label>
        <div class="inp">
          <input id="pw" name="password" type="password" placeholder="비밀번호" autocomplete="current-password" maxlength="64" aria-describedby="e-pw">
          <button type="button" class="eye" id="eye" aria-label="비밀번호 표시">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="ferr" id="e-pw"></span>
      </div>

      <div class="field confirm" id="f-pw2" hidden>
        <label for="pw2">Confirm Password</label>
        <div class="inp"><input id="pw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" maxlength="64" aria-describedby="e-pw2"></div>
        <span class="ferr" id="e-pw2"></span>
      </div>

      <button class="btn gold" id="go" type="submit">LOGIN</button>
      <div class="sep" aria-hidden="true">◆</div>
      <button class="btn ghost" id="swap" type="button">CREATE ACCOUNT</button>

      <div class="suits" aria-hidden="true"><span>♠</span><span class="r">♥</span><span class="r">♦</span><span>♣</span></div>
    </form>

  </section>
</main>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  var form=$('#form'), uid=$('#uid'), pw=$('#pw'), pw2=$('#pw2');
  var go=$('#go'), swap=$('#swap'), alertBox=$('#alert');
  var mode='login', busy=false;
  var ID_RE=/^[\p{L}\p{N}_]+$/u;

  function setErr(field, msg){
    var map={id:['#f-id','#e-id'], pw:['#f-pw','#e-pw'], pw2:['#f-pw2','#e-pw2']}[field];
    $(map[0]).classList.toggle('bad', !!msg);
    $(map[1]).textContent = msg || '';
    $(map[0]).querySelector('input').setAttribute('aria-invalid', msg ? 'true' : 'false');
  }
  function clearErrs(){ setErr('id'); setErr('pw'); setErr('pw2'); showAlert(''); }
  function showAlert(msg, ok){
    alertBox.hidden = !msg; alertBox.textContent = msg || '';
    alertBox.className = 'alert' + (ok ? ' ok' : '');
  }

  function setMode(m){
    mode = m; clearErrs();
    var reg = m === 'register';
    $('#ttl').textContent = reg ? 'CREATE ACCOUNT' : 'MEMBER LOGIN';
    $('#sub').textContent = reg ? '새로운 회원 계정을 만들어 주세요' : '회원 전용 라운지에 오신 것을 환영합니다';
    go.textContent = reg ? 'CREATE ACCOUNT' : 'LOGIN';
    swap.textContent = reg ? 'BACK TO LOGIN' : 'CREATE ACCOUNT';
    $('#f-pw2').hidden = !reg;
    pw.autocomplete = reg ? 'new-password' : 'current-password';
    pw.placeholder = reg ? '비밀번호 (영문+숫자 8자 이상)' : '비밀번호';
    pw2.value = ''; pw.value = '';
    uid.focus();
  }
  swap.addEventListener('click', function(){ setMode(mode === 'login' ? 'register' : 'login'); });

  $('#eye').addEventListener('click', function(){
    var show = pw.type === 'password';
    pw.type = pw2.type = show ? 'text' : 'password';
    this.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
  });

  [uid, pw, pw2].forEach(function(el){
    el.addEventListener('input', function(){
      var k = el === uid ? 'id' : el === pw ? 'pw' : 'pw2';
      setErr(k); showAlert('');
    });
  });

  function validate(){
    var ok = true, id = uid.value.trim(), p = pw.value;
    if (!id){ setErr('id','아이디를 입력해 주세요.'); ok = false; }
    else if (mode === 'register' && !ID_RE.test(id)){ setErr('id','아이디는 글자, 숫자, _ 만 사용할 수 있습니다. (공백 불가)'); ok = false; }
    if (!p){ setErr('pw','비밀번호를 입력해 주세요.'); ok = false; }
    else if (mode === 'register' && (p.length < 8 || !/[A-Za-z]/.test(p) || !/\d/.test(p))){
      setErr('pw','비밀번호는 영문과 숫자를 포함한 8자 이상이어야 합니다.'); ok = false; }
    if (mode === 'register' && ok && p !== pw2.value){ setErr('pw2','비밀번호가 일치하지 않습니다.'); ok = false; }
    if (!ok) (document.querySelector('.field.bad input') || uid).focus();
    return ok;
  }

  function showDone(){ location.replace('/lobby'); }

  function api(path, body){
    return fetch(path, {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body || {})
    }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(d){ return {ok:r.ok, d:d}; }); });
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (busy) return;
    clearErrs();
    if (!validate()) return;
    busy = true; go.disabled = swap.disabled = true;
    api(mode === 'login' ? '/api/login' : '/api/register', {username: uid.value.trim(), password: pw.value})
      .then(function(res){
        if (res.ok){ pw.value = pw2.value = ''; showDone(res.d.user); return; }
        var msg = res.d.error || '요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        if (res.d.field === 'username') setErr('id', msg);
        else if (res.d.field === 'password') setErr('pw', msg);
        else showAlert(msg);
        if (mode === 'login') pw.value = '';
        (res.d.field === 'username' ? uid : pw).focus();
      })
      .catch(function(){ showAlert('서버에 연결할 수 없습니다. 네트워크를 확인해 주세요.'); })
      .then(function(){ busy = false; go.disabled = swap.disabled = false; });
  });

  if (/[?&]out=1/.test(location.search)) showAlert('로그아웃되었습니다.', true);

})();
</script>
</body>
</html>
